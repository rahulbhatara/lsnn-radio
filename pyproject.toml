[project]
name = "opus_whip_pacer"
version = "0.1.0"
description = "Bit-Exact Raw Opus WebRTC/WHIP Streamer & Live Windows Audio Broadcaster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.15.0",
    "av>=17.1.0",
    "aiohttp>=3.14.3",
    "PySide6>=6.6.0",
    "qasync>=0.28.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "yt-dlp>=2024.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "src/**"]
